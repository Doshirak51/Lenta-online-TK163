name: Bootstrap Spec Kit

on:
  push:
    branches:
      - codex/impeccable-setup
    paths:
      - .github/workflows/bootstrap-spec-kit.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/impeccable-setup
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Spec Kit CLI
        run: uv tool install specify-cli

      - name: Initialize Spec Kit for Codex
        run: specify init --here --force --integration codex

      - name: Commit generated Spec Kit files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: initialize Spec Kit for Codex [skip ci]"
            git push origin HEAD:codex/impeccable-setup
          fi
